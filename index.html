<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b4f6c">
<title>제주몽 · 제주 생활 안내</title>
<meta name="description" content="제주 물때 시간표와 제주 열두 달 달력을 한곳에서">
<meta property="og:title" content="제주몽 · 제주 생활 안내">
<meta property="og:description" content="제주 물때 시간표 · 제주 열두 달 달력">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@700&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f4f1ea; --ink:#1d2a30; --sub:#5d6b70; --card:#ffffff;
    --sea:#0b4f6c; --sea2:#1e88a8; --tang:#e8772e; --tang2:#f4a259;
    --line:rgba(0,0,0,.07);
  }
  @media (prefers-color-scheme: dark){
    :root{ --bg:#0f171b; --ink:#eef3f4; --sub:#9fb0b5; --card:#18232a; --line:rgba(255,255,255,.08); }
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{-webkit-text-size-adjust:100%}
  body{
    font-family:"Noto Sans KR",-apple-system,BlinkMacSystemFont,sans-serif;
    background:var(--bg); color:var(--ink); min-height:100vh; min-height:100dvh;
    padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);
  }
  .wrap{max-width:520px;margin:0 auto;padding:0 18px 40px}

  header{
    position:relative; overflow:hidden; color:#fff;
    margin:0 -18px 26px; padding:54px 24px 74px;
    background:linear-gradient(160deg,var(--sea) 0%,var(--sea2) 100%);
  }
  header svg.wave{position:absolute;left:0;bottom:-1px;width:100%;height:48px}
  .eyebrow{font-size:13px;letter-spacing:.14em;opacity:.8;margin-bottom:10px}
  h1{font-family:"Gowun Batang",serif;font-size:32px;line-height:1.3}
  header p{margin-top:12px;font-size:15px;line-height:1.6;opacity:.9}

  .menu{display:grid;gap:16px}
  a.card{
    display:flex;align-items:center;gap:16px;
    background:var(--card);border:1px solid var(--line);border-radius:20px;
    padding:22px 20px;text-decoration:none;color:inherit;
    box-shadow:0 6px 20px rgba(0,0,0,.06);
    transition:transform .15s ease, box-shadow .15s ease;
    -webkit-tap-highlight-color:transparent;
  }
  a.card:active{transform:scale(.98)}
  @media (hover:hover){ a.card:hover{transform:translateY(-2px);box-shadow:0 10px 28px rgba(0,0,0,.1)} }
  .icon{
    flex:none;width:58px;height:58px;border-radius:16px;
    display:grid;place-items:center;
  }
  .icon svg{width:30px;height:30px}
  .tide .icon{background:linear-gradient(150deg,var(--sea2),var(--sea));}
  .cal .icon{background:linear-gradient(150deg,var(--tang2),var(--tang));}
  .txt{flex:1;min-width:0}
  .txt h2{font-size:19px;font-weight:700;margin-bottom:5px}
  .txt p{font-size:14px;line-height:1.5;color:var(--sub)}
  .arrow{flex:none;color:var(--sub);font-size:22px}

  .note{
    margin-top:28px;padding:16px 18px;border-radius:16px;
    background:rgba(30,136,168,.08);font-size:13.5px;line-height:1.6;color:var(--sub)
  }
  footer{margin-top:30px;text-align:center;font-size:12.5px;color:var(--sub)}
  footer a{color:inherit}
</style>
</head>
<body>
  <div class="wrap">
    <header>
      <div class="eyebrow">JEJUMONG</div>
      <h1>제주에서<br>오늘을 누리는 법</h1>
      <p>바다에 나가기 전 물때를, 여행을 계획할 땐<br>열두 달 달력을 확인하세요.</p>
      <svg class="wave" viewBox="0 0 400 48" preserveAspectRatio="none" aria-hidden="true">
        <path d="M0 24 C60 44 120 4 200 22 S340 40 400 18 V48 H0Z" fill="var(--bg)"/>
      </svg>
    </header>

    <nav class="menu">
      <a class="card tide" href="https://jejumong.github.io/jeju-tide/">
        <div class="icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M2 8c2-1.5 3.5-1.5 5 0s3.5 1.5 5 0 3.5-1.5 5 0 3.5 1.5 5 0"/>
            <path d="M2 13c2-1.5 3.5-1.5 5 0s3.5 1.5 5 0 3.5-1.5 5 0 3.5 1.5 5 0"/>
            <path d="M2 18c2-1.5 3.5-1.5 5 0s3.5 1.5 5 0 3.5-1.5 5 0 3.5 1.5 5 0"/>
          </svg>
        </div>
        <div class="txt">
          <h2>제주 물때 시간표</h2>
          <p>만조·간조 시간을 한눈에. 바릇잡이·낚시·해안 산책 전에 확인하세요.</p>
        </div>
        <span class="arrow">›</span>
      </a>

      <a class="card cal" href="https://jejumong.github.io/jeju-calendar/">
        <div class="icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <rect x="3" y="5" width="18" height="16" rx="3"/>
            <path d="M3 10h18M8 3v4M16 3v4"/>
            <circle cx="12" cy="15.5" r="1.6" fill="#fff" stroke="none"/>
          </svg>
        </div>
        <div class="txt">
          <h2>제주 열두 달 달력</h2>
          <p>1월부터 12월까지 축제·풍경·제철 먹거리·여행 적기를 날짜별로.</p>
        </div>
        <span class="arrow">›</span>
      </a>
    </nav>

    <div class="note">
      📌 이 페이지를 휴대폰 홈 화면에 추가해 두면 앱처럼 바로 열 수 있어요.<br>
      (아이폰: 공유 버튼 → ‘홈 화면에 추가’)
    </div>

    <footer>
      © <span id="y"></span> 제주몽 · 구좌읍 한동리에서
    </footer>
  </div>
  <script>document.getElementById('y').textContent = new Date().getFullYear();</script>
</body>
</html>
